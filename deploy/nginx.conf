# Reverse proxy for no-bias-essay-grader.
# Copy to /etc/nginx/sites-available/no-bias-essay-grader, symlink into
# sites-enabled, then run certbot against server_name for TLS.

upstream no_bias_essay_grader {
    server unix:/run/no-bias-essay-grader/gunicorn.sock;
}

server {
    listen 80;
    server_name example.com;

    location = /favicon.ico { access_log off; log_not_found off; }

    location /static/ {
        alias /srv/no-bias-essay-grader/staticfiles/;
    }

    location / {
        proxy_pass http://no_bias_essay_grader;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
